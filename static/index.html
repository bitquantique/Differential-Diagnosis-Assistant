<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differential Diagnosis Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-shell">
        <header class="terminal-header">
            <span class="brand">DIFF-DX // INTERFACE</span>
        </header>

        <main class="workspace">
            <section class="pane editor-pane">
                <div class="pane-toolbar">
                    <span class="pane-label">INPUT_NOTE</span>
                    <div class="actions">
                        <button id="run-btn" class="action-btn">Analyze</button>
                    </div>
                </div>
                <div class="editor-body">
                    <div id="gutter" class="editor-gutter">>>></div>
                    <textarea 
                        id="note-input" 
                        class="editor-textarea" 
                        placeholder="Enter clinical note here..." 
                        spellcheck="false"
                    ></textarea>
                </div>
            </section>

            <section class="pane output-pane">
                <div class="pane-toolbar">
                    <span class="pane-label">ANALYSIS_OUTPUT</span>
                </div>
                <div id="output-pane" class="output-container">
                    <div class="output-placeholder">> Awaiting clinical note execution...</div>
                </div>
            </section>
        </main>

        <footer class="terminal-status-bar">
            <span id="status-text">STATUS: IDLE</span>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
